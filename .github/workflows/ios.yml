name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build on an iPhone simulator
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          set -euo pipefail
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone [^()]+' | head -1 | awk '{$1=$1;print}')
          xcodebuild build \
            -project Tournaments.xcodeproj \
            -scheme Tournaments \
            -destination "platform=iOS Simulator,name=${device}" \
            CODE_SIGNING_ALLOWED=NO

name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build on an iPhone simulator
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Tournaments.xcodeproj \
            -scheme Tournaments \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
